<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 282" width="300" height="282" role="img" aria-label="Afiche BTS World Tour Arirang - Lima, Estadio San Marcos">
  <!--
    Recreación del afiche para la demo (no se usa la imagen oficial, que tiene
    derechos). Los textos llevan textLength para que se vea igual aunque el
    dispositivo no tenga la tipografía condensada original.
    Para usar el afiche real: guarda tu imagen en este mismo directorio y
    apunta `poster` de FEATURED_EVENT (src/data/mockDb.js) a ese archivo.
  -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f8f6f4"/>
      <stop offset="60%" stop-color="#f0eeec"/>
      <stop offset="100%" stop-color="#e7e5e3"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eceae8"/>
      <stop offset="100%" stop-color="#c4c2c0"/>
    </linearGradient>
    <linearGradient id="coatA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4d"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="coatB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#343437"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d7d80"/>
      <stop offset="100%" stop-color="#46464a"/>
    </linearGradient>
  </defs>

  <rect width="300" height="282" fill="url(#paper)"/>

  <!-- Trazos rojos de marcador tras el título -->
  <g fill="#e8123c">
    <path d="M116 11l80-2 -3 23 -80 2z"/>
    <path d="M57 44l186-3 -4 24 -186 3z"/>
    <path d="M73 79l154-3 -4 24 -154 3z"/>
  </g>

  <!-- Título del tour -->
  <g fill="#0d0d0f" font-family="'Arial Narrow', Impact, Arial, sans-serif" font-weight="900"
     text-anchor="middle" lengthAdjust="spacingAndGlyphs">
    <text x="154" y="31" font-size="28" textLength="60">BTS</text>
    <text x="150" y="65" font-size="30" textLength="178">WORLD TOUR</text>
    <text x="150" y="100" font-size="30" textLength="146">ARIRANG</text>
  </g>

  <!-- Ciudad, recinto y fechas -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" lengthAdjust="spacingAndGlyphs">
    <text x="150" y="121" font-size="8.5" font-weight="700" fill="#0d0d0f" textLength="24">LIMA</text>
    <text x="150" y="133" font-size="7.5" font-weight="500" fill="#2b2b2d" textLength="98">ESTADIO SAN MARCOS</text>
    <text x="150" y="146" font-size="7.5" font-weight="700" fill="#0d0d0f" textLength="78">07.10.2026 MIE</text>
    <text x="150" y="157" font-size="7.5" font-weight="700" fill="#0d0d0f" textLength="78">09.10.2026 VIE</text>
    <text x="150" y="168" font-size="7.5" font-weight="700" fill="#0d0d0f" textLength="78">10.10.2026 SÁB</text>
  </g>

  <!-- Foto grupal en blanco y negro: 7 integrantes que llenan el ancho -->
  <g>
    <rect x="0" y="176" width="300" height="88" fill="url(#stage)"/>

    <!-- fila trasera -->
    <g fill="url(#coatB)">
      <path d="M4 264l3-52q6-11 18-11t18 11l3 52z"/>
      <circle cx="25" cy="199" r="10" fill="url(#skin)"/>
      <path d="M86 264l3-50q6-11 17-11t17 11l3 50z"/>
      <circle cx="106" cy="201" r="9.5" fill="url(#skin)"/>
      <path d="M166 264l3-51q6-11 17-11t17 11l3 51z"/>
      <circle cx="186" cy="200" r="9.5" fill="url(#skin)"/>
      <path d="M248 264l3-48q6-11 17-11t17 11l3 48v0z"/>
      <circle cx="268" cy="203" r="9" fill="url(#skin)"/>
    </g>

    <!-- fila delantera -->
    <g fill="url(#coatA)">
      <path d="M42 264l4-56q7-12 19-12t19 12l4 56z"/>
      <circle cx="65" cy="194" r="11" fill="url(#skin)"/>
      <path d="M124 264l4-55q7-12 19-12t19 12l4 55z"/>
      <circle cx="147" cy="195" r="10.5" fill="url(#skin)"/>
      <path d="M206 264l4-54q7-12 18-12t18 12l4 54z"/>
      <circle cx="228" cy="196" r="10.5" fill="url(#skin)"/>
    </g>

    <!-- cabello -->
    <g fill="#141416">
      <path d="M15 197a10 10 0 0 1 20 0q-10-6-20 0z"/>
      <path d="M54 192a11 11 0 0 1 22 0q-11-6-22 0z"/>
      <path d="M96.5 199a9.5 9.5 0 0 1 19 0q-9.5-6-19 0z"/>
      <path d="M136.5 193a10.5 10.5 0 0 1 21 0q-10.5-6-21 0z"/>
      <path d="M176.5 198a9.5 9.5 0 0 1 19 0q-9.5-6-19 0z"/>
      <path d="M217.5 194a10.5 10.5 0 0 1 21 0q-10.5-6-21 0z"/>
      <path d="M259 201a9 9 0 0 1 18 0q-9-6-18 0z"/>
    </g>

    <!-- logo circular rojo del tour -->
    <g>
      <circle cx="128" cy="246" r="13" fill="#e8123c"/>
      <circle cx="150" cy="246" r="13" fill="#e8123c"/>
      <circle cx="172" cy="246" r="13" fill="#e8123c"/>
      <g fill="#f4f2f0">
        <circle cx="128" cy="246" r="5.5"/>
        <rect x="142" y="243" width="16" height="3.5"/>
        <rect x="165" y="239" width="3.5" height="15"/>
        <rect x="165" y="245" width="13" height="3.5"/>
      </g>
    </g>
  </g>

  <!-- Franja negra de patrocinadores -->
  <rect x="0" y="264" width="300" height="18" fill="#09090b"/>
  <g fill="#ededed" font-family="Arial, Helvetica, sans-serif" font-size="5" font-weight="700"
     text-anchor="middle" lengthAdjust="spacingAndGlyphs">
    <text x="42" y="276" textLength="26">BIGHIT</text>
    <text x="80" y="276" textLength="22">HYBE</text>
    <text x="124" y="276" textLength="44">LIVE NATION</text>
    <text x="170" y="276" textLength="18">VISA</text>
    <text x="210" y="276" textLength="38">SAMSUNG</text>
    <text x="252" y="276" textLength="18">ARIH</text>
    <text x="282" y="276" textLength="22">SPOTIFY</text>
  </g>
</svg>
